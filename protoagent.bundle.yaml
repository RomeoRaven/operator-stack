# operator-stack — the read-only bundle for RomeoRaven/protoAgent issue #2.
#
# Incubation pins: Operator Control 0.5 and Operator Policy 0.1 have no authorized
# releases. These exact commit SHAs are immutable and intentionally skip update
# checks. Move to verified release tags only after separate release approval.

id: operator-stack
name: Operator Stack
description: >-
  A conservative protoAgent fleet-operator composition. It installs the read-only
  Operator Control evidence plugin plus a pure deterministic attention policy,
  starts with no enrolled targets or credentials, and performs no control action.

verified_against: 0.136.0

plugins:
  - { id: operator_control, url: https://github.com/RomeoRaven/operator-plugin, ref: 7895f50a726f97aca22e57f9618161bd1ba67318 }
  - { id: operator_policy, url: https://github.com/RomeoRaven/operator-policy-plugin, ref: ae2b438fac1cb55208ef9875a7561d92783be835 }

enabled: [operator_control, operator_policy]

config:
  operator_control:
    targets: []
    timeout_seconds: 5
